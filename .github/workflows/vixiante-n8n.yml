function normaliza(t){return (t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();}
function tag(texto,t){const m=texto.match(new RegExp("<"+t+"[^>]*>([\\s\\S]*?)<\\/"+t+">"));return m?m[1].trim():"";}
function todosTag(texto,t){return (texto.match(new RegExp("<"+t+"[^>]*>[\\s\\S]*?<\\/"+t+">","g"))||[]).map(function(x){return x.replace(new RegExp("<\\/?"+t+"[^>]*>","g"),"").trim();});}
function entre(texto,ini,fin){const i=texto.indexOf(ini);if(i===-1)return "";const j=texto.indexOf(fin,i+ini.length);if(j===-1)return "";return texto.substring(i+ini.length,j);}
function normalizarImporte(imp){if(!imp)return "";var s=String(imp).replace(/[^0-9.,]/g,"");if(!s)return "";if(s.indexOf(",")!==-1){s=s.replace(/\./g,"").replace(",",".");}var n=parseFloat(s);if(isNaN(n))return "";return n.toFixed(2)+" EUR";}
function limpiar(t){return (t||"").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,"\"").replace(/&#xD;/g," ").replace(/\s+/g," ").trim();}
function capitaliza(t){return t?t.charAt(0).toUpperCase()+t.slice(1):t;}

function sacarNext(xml){const m=xml.match(/<link[^>]*rel="next"[^>]*>/);if(!m)return "";const h=m[0].match(/href="([^"]*)"/);return h?h[1]:"";}
function updatedDe(entry){const m=entry.match(/<updated>([\s\S]*?)<\/updated>/);return m?new Date(m[1].trim()):null;}
function esperar(ms){return new Promise(function(r){setTimeout(r,ms);});}

const dataHoxe = new Date().toLocaleDateString("gl-ES");
const hoxe = new Date().toLocaleDateString("en-CA",{timeZone:"Europe/Madrid"});
const limite = new Date(Date.now() - HORAS_VENTA*60*60*1000);

// Procesa unha entrada: devolve o obxecto final pequeno, ou null se non pasa o filtro
function procesar(e){
  const tipoCod = tag(entre(e,"<cac:ProcurementProject>","</cac:ProcurementProject>"),"cbc:TypeCode");
  if (tipoCod==="1"||tipoCod==="3"||tipoCod==="31") return null;   // FILTRO 0: fora obras e subministracions

  const titulo = limpiar(tag(e,"title"));
  const tituloNorm = normaliza(titulo);

  // Caso especial: estudo/asesoramento previo a unha licitacion de auga -> interesa e vai a PRIORITARIA.
  // Esixe as dúas cousas no titulo: (a) que sexa un estudo/asesoramento e (b) que o contexto sexa auga.
  var esEstudoAugaPrioritario = estudoPrevio.some(function(k){return tituloNorm.indexOf(k)!==-1;}) &&
                                contextoAuga.some(function(k){return tituloNorm.indexOf(k)!==-1;});

  const cpvUnicos=[];
  todosTag(e,"cbc:ItemClassificationCode").forEach(function(c){if(cpvUnicos.indexOf(c)===-1)cpvUnicos.push(c);});
  const casaCPV = cpvUnicos.some(function(c){var p=c.substring(0,5);return cpvInterese.indexOf(p)!==-1 && cpvDebil.indexOf(p)===-1;});
  const casaPalabra = palabrasClave.some(function(k){return tituloNorm.indexOf(k)!==-1;}) || clavesSociais.some(function(k){return tituloNorm.indexOf(k)!==-1;});
  if (!casaCPV && !casaPalabra && !esEstudoAugaPrioritario) return null;
  // 85312 (asistencia social): so entra pola liña social (violencia/igualdade/mocidade)
  var ten85312 = cpvUnicos.some(function(c){return c.substring(0,5)==="85312";});
  if (ten85312 && !casaCPV && !clavesSociais.some(function(k){return tituloNorm.indexOf(k)!==-1;})) return null;

  // Seguridade/vixilancia por CPV: se leva un CPV de seguridade e non ten CPV forte de
  // interese nin un servizo do noso nucleo no titulo, fora (ex.: "seguridad del museo").
  var tenSeguridade = cpvUnicos.some(function(c){return cpvVetoSeguridade.indexOf(c.substring(0,5))!==-1;});
  if (tenSeguridade && !casaCPV && !rescate.some(function(r){return tituloNorm.indexOf(r)!==-1;})) return null;

  if (vetoDuro.some(function(v){return tituloNorm.indexOf(v)!==-1;})) return null;
  if (!esEstudoAugaPrioritario && vetoAuga.some(function(v){return tituloNorm.indexOf(v)!==-1;})) return null;
  if (tituloNorm.indexOf("piscina")!==-1 && !rescate.some(function(r){return tituloNorm.indexOf(r)!==-1;})) return null;
  if (vetoBrando.some(function(v){return tituloNorm.indexOf(v)!==-1;}) &&
      !rescateBrando.some(function(r){return tituloNorm.indexOf(r)!==-1;})) return null;

  // ---- Datos do summary (organo, importe, id) ----
  const summary = tag(e,"summary");
  let organo="",importe="",idLic="";
  summary.split(";").forEach(function(p){p=p.trim();
    if(p.indexOf("Órgano de Contratación:")===0)organo=p.replace("Órgano de Contratación:","").trim();
    if(p.indexOf("Importe:")===0)importe=normalizarImporte(p.replace("Importe:","").trim());
    if(p.indexOf("Id licitación:")===0)idLic=p.replace("Id licitación:","").trim();});

  // ---- PECHE ESTADO/PRAZO (versión suave): so tira o que está pechado ou vencido ----
  // Mantense se a data de prazo falta (para non perder licitacions boas con feed incompleto).
  const estadoCod = tag(e,"cbc-place-ext:ContractFolderStatusCode");
  const awardDate = tag(e,"cbc:AwardDate");
  const prazoData = tag(entre(e,"<cac:TenderSubmissionDeadlinePeriod>","</cac:TenderSubmissionDeadlinePeriod>"),"cbc:EndDate");
  const prazoHora = tag(entre(e,"<cac:TenderSubmissionDeadlinePeriod>","</cac:TenderSubmissionDeadlinePeriod>"),"cbc:EndTime");
  const pechada = (estadoCod==="RES" || estadoCod==="ADJ" || !!awardDate || (prazoData && prazoData < hoxe));
  if (pechada) return null;

  // ---- Provincia + clasificacion prioritaria (con fallback ao organo se o lugar é xenérico) ----
  const provinciaRaw = tag(entre(e,"<cac:RealizedLocation>","</cac:RealizedLocation>"),"cbc:CountrySubentity");
  const provinciaNorm = normaliza(provinciaRaw);
  let baseLoc = provinciaNorm;
  if (!baseLoc || baseLoc==="espana") baseLoc = normaliza(organo);   // fallback: deducir zona do organo
  const zonaMatch = zonasPrioritarias.find(function(z){return baseLoc.indexOf(z)!==-1;});
  let prioritaria = zonaMatch ? "Si" : "Non";
  if (esEstudoAugaPrioritario) prioritaria = "Si";   // estudos previos de auga: sempre prioritarios
  let provinciaDisplay = provinciaRaw || "—";
  const cidadesGalegas = ["santiago de compostela","compostela","vigo","ferrol","universidade de santiago","universidade de vigo","xunta de galicia"];
  if ((!provinciaNorm || provinciaNorm==="espana") && zonaMatch) {
    provinciaDisplay = (cidadesGalegas.indexOf(zonaMatch)!==-1) ? "Galicia" : capitaliza(zonaMatch);
  }

  let url="";const ml=e.match(/<link\s+href="([^"]*)"/);if(ml)url=limpiar(ml[1]);

  let dataLimite="—";
  if(prazoData){const pd=prazoData.split("-");dataLimite=(pd.length===3)?(pd[2]+"/"+pd[1]+"/"+pd[0]):prazoData;if(prazoHora)dataLimite=dataLimite+" "+prazoHora.substring(0,5);}

  let cpvFmt=cpvUnicos.map(function(c){return cpvTexto[c]?(c+"-"+cpvTexto[c]+"."):c;}).join(", ");
  if(!cpvFmt)cpvFmt="—";

  return {
    data: dataHoxe,
    categoria: "nacional",
    titulo: titulo,
    organo: organo,
    importe: importe,
    idLicitacion: idLic,
    cpv: cpvFmt,
    provincia: provinciaDisplay,
    dataLimite: dataLimite,
    prioritaria: prioritaria,
    url: url
  };

}

// Baixa unha paxina con reintentos
const baixar = async (u) => {
  let ultimoErro = null;
  for (let intento = 1; intento <= INTENTOS; intento++) {
    try {
      return await this.helpers.httpRequest({ method:"GET", url:u, json:false, timeout:TIMEOUT_MS });
    } catch (err) {
      ultimoErro = err;
      if (intento < INTENTOS) await esperar(2000 * intento);
    }
  }
  throw ultimoErro;
};

// Baixa e filtra un feed enteiro (paxinando ata cubrir 24h). Devolve resultados + diagnostico.
async function baixarFeed(urlInicial) {
  let url = urlInicial, paxinas = 0, entradas24h = 0, entradasTotais = 0, parouPorData = false, parouPorTempo = false;
  let maisVella = null;   // updated mais antigo alcanzado (diagnostico de cobertura)
  const salida = [];
  for (let i = 0; i < MAX_PAXINAS; i++) {
    // TEITO DE TEMPO: se levamos xa moito descargando, paramos e seguimos co que temos.
    // A memoria anti-repeticion recupera o que quede fora na tirada do dia seguinte.
    if (Date.now() - INICIO_DESCARGA > MAX_MS_DESCARGA) { parouPorTempo = true; break; }
    let xml;
    try { xml = await baixar(url); }
    catch (err) {
      if (paxinas === 0) throw new Error("Feed non responde tras " + INTENTOS + " intentos: " + (err && err.message ? err.message : err));
      break;
    }
    paxinas++;
    const entradas = xml.match(/<entry\b[\s\S]*?<\/entry>/g) || [];
    entradasTotais += entradas.length;
    const next = sacarNext(xml);
    xml = null;
    let frescasNaPaxina = 0;
    for (const e of entradas) {
      const u = updatedDe(e);
      if (u && (!maisVella || u < maisVella)) maisVella = u;
      if (u && u >= limite) { frescasNaPaxina++; entradas24h++; const obj = procesar(e); if (obj) salida.push({ json: obj }); }
    }
    // PARAR so cando unha paxina ENTEIRA queda fora da xanela de 24h.
    // (Antes paraba na primeira entrada vella; o feed da PLACSP NON sempre ven ordenado por
    //  <updated>, e unha soa entrada desordenada cortaba a descarga -> perdianse licitacions
    //  posteriores da mesma xanela. Agora toleramos o desorde dentro dunha paxina.)
    if (frescasNaPaxina === 0) { parouPorData = true; break; }
    if (!next) break;
    url = next;
    await esperar(PAUSA_MS);
  }
  return { salida: salida, paxinas: paxinas, entradas24h: entradas24h, entradasTotais: entradasTotais, parouPorData: parouPorData, parouPorTempo: parouPorTempo, maisVella: maisVella };
}

// 1) Feed NACIONAL (obrigatorio): se cae por completo, a execucion falla en vermello.
const nac = await baixarFeed(URL_NACIONAL);
if (nac.paxinas > 0 && nac.entradasTotais === 0) {
  throw new Error("PLACSP nacional devolveu feed baleiro: probable caida/mantemento do servidor de sindicacion.");
}

// 2) Feed AGREGADAS (autonomicas). A proba de fallos: se cae, seguimos SO coas nacionais.
let agr = { salida: [], paxinas: 0, entradas24h: 0, entradasTotais: 0 };
try {
  agr = await baixarFeed(URL_AGREGADAS);
} catch (err) {
  console.log("AVISO: feed de agregadas non dispoñible, seguimos coas nacionais. " + (err && err.message ? err.message : err));
}

// Combinar as dúas fontes e deduplicar por URL/id
let salida = nac.salida.concat(agr.salida);
const vistos = {};
salida = salida.filter(function(it){
