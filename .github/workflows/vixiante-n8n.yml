name: Vixiante n8n (auto-reinicio)

# Comproba cada 5 min se o n8n responde. Se dá erro de servidor (5xx) ou non responde,
# reinicia os servizos Primary e Worker en Railway (API), sen intervencion manual.
on:
  schedule:
    - cron: "*/5 * * * *"     # cada 5 minutos (GitHub pode atrasarse algo; é normal)
  workflow_dispatch: {}         # tamén se pode lanzar a man desde a pestana "Actions"

# Evita que se solapen dúas execucions do vixiante
concurrency:
  group: vixiante-n8n
  cancel-in-progress: false

jobs:
  vixiar:
    runs-on: ubuntu-latest
    env:
      N8N_URL: ${{ secrets.N8N_URL }}                    # ex.: https://primary-production-9f6e.up.railway.app/
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      GRAPHQL: "https://backboard.railway.com/graphql/v2"
      ENV_NAME: "production"
      PRIMARY_NAME: "Primary"
      WORKER_NAME: "Worker"
    steps:
      - name: Comprobar e, se compre, reiniciar
        run: |
          set -uo pipefail

          # 1) Comprobar ata 3 veces (evita reiniciar por un ping solto).
          #    "Caído" = non responde (000) ou erro de servidor (>=500, p.ex. o 503).
          ok=0
          code="000"
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$N8N_URL" || echo "000")
            echo "Comprobacion $i -> HTTP $code"
            if [ "$code" != "000" ] && [ "$code" -lt 500 ] 2>/dev/null; then ok=1; break; fi
            [ "$i" -lt 3 ] && sleep 15
          done

          if [ "$ok" = "1" ]; then
            echo "OK: o n8n responde (HTTP $code). Nada que facer."
            exit 0
          fi

          echo "AVISO: o n8n non responde (HTTP $code). Vou reinicialo en Railway."

          # 2) Descubrir os IDs (environment + servizos) a partir do PROJECT_ID.
          Q='query project($id: String!){ project(id:$id){ environments{edges{node{id name}}} services{edges{node{id name}}} } }'
          proj=$(jq -n --arg q "$Q" --arg id "$PROJECT_ID" '{query:$q,variables:{id:$id}}' \
            | curl -s -X POST "$GRAPHQL" -H "Authorization: Bearer $RAILWAY_TOKEN" -H "Content-Type: application/json" -d @-)

          if echo "$proj" | jq -e '.errors' >/dev/null 2>&1; then
            echo "ERRO consultando Railway (revisa o token/PROJECT_ID): $proj"; exit 1
          fi

          env_id=$(echo "$proj" | jq -r --arg n "$ENV_NAME" '.data.project.environments.edges[]|select(.node.name==$n)|.node.id')
          primary_id=$(echo "$proj" | jq -r --arg n "$PRIMARY_NAME" '.data.project.services.edges[]|select(.node.name==$n)|.node.id')
          worker_id=$(echo "$proj" | jq -r --arg n "$WORKER_NAME" '.data.project.services.edges[]|select(.node.name==$n)|.node.id')

          if [ -z "$env_id" ] || [ "$env_id" = "null" ] || [ -z "$primary_id" ] || [ "$primary_id" = "null" ]; then
            echo "ERRO: non atopei os IDs. Revisa que ENV_NAME=production e os nomes Primary/Worker son correctos."
            exit 1
          fi

          # 3) Reiniciar (redeploy) Primary e Worker.
          redeploy () {
            sid="$1"; nome="$2"
            if [ -z "$sid" ] || [ "$sid" = "null" ]; then echo "Salto $nome (sen id)"; return 0; fi
            payload=$(jq -n --arg s "$sid" --arg e "$env_id" \
              '{query:"mutation r($s:String!,$e:String!){serviceInstanceRedeploy(serviceId:$s,environmentId:$e)}",variables:{s:$s,e:$e}}')
            resp=$(curl -s -X POST "$GRAPHQL" -H "Authorization: Bearer $RAILWAY_TOKEN" -H "Content-Type: application/json" -d "$payload")
            if echo "$resp" | jq -e '.errors' >/dev/null 2>&1; then
              echo "ERRO ao reiniciar $nome: $resp"
            else
              echo "OK: reinicio de $nome disparado."
            fi
          }

          redeploy "$primary_id" "Primary"
          redeploy "$worker_id" "Worker"
          echo "Feito. O n8n debería volver responder nun par de minutos."
