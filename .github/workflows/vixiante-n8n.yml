name: Vixiante n8n (auto-reinicio)

# Comproba cada 5 min se o n8n responde. Se non responde ou da erro de servidor (5xx, p.ex.
# o 503 "Database is not ready"), reinicia os servizos en Railway, sen intervencion manual.
#
# DOUS NIVEIS:
#   Nivel 1 -> reinicia Primary e Worker (caso normal: n8n perdeu a conexion coa BD).
#   Nivel 2 -> se tras iso SEGUE caido, reinicia TAMEN Postgres e Redis e volve levantar n8n
#              (cubre o "Database is not ready" con todo "Online").
#
# KEEPALIVE: unha vez ao mes fai un commit baleiro para que GitHub NON desactive o cron
#            (GitHub apaga os workflows programados tras ~60 dias sen actividade no repo).

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: vixiante-n8n
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  vixiar:
    runs-on: ubuntu-latest
    env:
      N8N_URL: ${{ secrets.N8N_URL }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      GRAPHQL: "https://backboard.railway.com/graphql/v2"
      ENV_NAME: "production"
      PRIMARY_NAME: "Primary"
      WORKER_NAME: "Worker"
      POSTGRES_NAME: "Postgres"
      REDIS_NAME: "Redis"
    steps:
      - name: Descargar o repo (para o keepalive)
        uses: actions/checkout@v4

      - name: Keepalive mensual (manter o cron activo)
        run: |
          set +e
          # So o dia 1 de cada mes, as ~03:00 UTC (a 1a execucion desa hora). Non falla nunca o vixiante.
          if [ "$(date -u +%d)" = "01" ] && [ "$(date -u +%H)" = "03" ] && [ "$(date -u +%M)" -lt 5 ]; then
            git config user.name "vixiante-bot"
            git config user.email "actions@users.noreply.github.com"
            git commit --allow-empty -m "keepalive: manter activo o vixiante"
            git push
          fi
          exit 0

      - name: Comprobar e, se compre, reiniciar
        run: |
          set -uo pipefail

          # --- Funcion: esta "arriba" o n8n? (3 intentos; "caido" = 000 ou >=500) ---
          esta_arriba () {
            local code
            for i in 1 2 3; do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$N8N_URL" || echo "000")
              echo "   Comprobacion $i -> HTTP $code"
              if [ "$code" != "000" ] && [ "$code" -lt 500 ] 2>/dev/null; then return 0; fi
              if [ "$i" -lt 3 ]; then sleep 15; fi
            done
            return 1
          }

          echo "== Comprobacion inicial =="
          if esta_arriba; then
            echo "OK: o n8n responde. Nada que facer."
            exit 0
          fi

          echo "AVISO: o n8n non responde. Vou reinicialo en Railway."

          # --- Descubrir os IDs (environment + servizos) ---
          Q='query project($id: String!){ project(id:$id){ environments{edges{node{id name}}} services{edges{node{id name}}} } }'
          proj=$(jq -n --arg q "$Q" --arg id "$PROJECT_ID" '{query:$q,variables:{id:$id}}' \
            | curl -s -X POST "$GRAPHQL" -H "Authorization: Bearer $RAILWAY_TOKEN" -H "Content-Type: application/json" -d @-)

          if echo "$proj" | jq -e '.errors' >/dev/null 2>&1; then
            echo "ERRO consultando Railway (revisa o token/PROJECT_ID): $proj"; exit 1
          fi

          env_id=$(echo "$proj" | jq -r --arg n "$ENV_NAME" '.data.project.environments.edges[]|select(.node.name==$n)|.node.id')
          primary_id=$(echo "$proj" | jq -r --arg n "$PRIMARY_NAME" '.data.project.services.edges[]|select(.node.name==$n)|.node.id')
          worker_id=$(echo "$proj" | jq -r --arg n "$WORKER_NAME" '.data.project.services.edges[]|select(.node.name==$n)|.node.id')
          postgres_id=$(echo "$proj" | jq -r --arg n "$POSTGRES_NAME" '.data.project.services.edges[]|select(.node.name==$n)|.node.id')
          redis_id=$(echo "$proj" | jq -r --arg n "$REDIS_NAME" '.data.project.services.edges[]|select(.node.name==$n)|.node.id')

          if [ -z "$env_id" ] || [ "$env_id" = "null" ] || [ -z "$primary_id" ] || [ "$primary_id" = "null" ]; then
            echo "ERRO: non atopei os IDs. Revisa ENV_NAME=production e os nomes dos servizos."
            exit 1
          fi

          # --- Funcion para reiniciar (redeploy) un servizo ---
          redeploy () {
            sid="$1"; nome="$2"
            if [ -z "$sid" ] || [ "$sid" = "null" ]; then echo "   (Salto $nome: sen id)"; return 0; fi
            payload=$(jq -n --arg s "$sid" --arg e "$env_id" \
              '{query:"mutation r($s:String!,$e:String!){serviceInstanceRedeploy(serviceId:$s,environmentId:$e)}",variables:{s:$s,e:$e}}')
            resp=$(curl -s -X POST "$GRAPHQL" -H "Authorization: Bearer $RAILWAY_TOKEN" -H "Content-Type: application/json" -d "$payload")
            if echo "$resp" | jq -e '.errors' >/dev/null 2>&1; then
              echo "   ERRO ao reiniciar $nome: $resp"
            else
              echo "   OK: reinicio de $nome disparado."
            fi
          }

          # === NIVEL 1: reiniciar so n8n (Primary + Worker) ===
          echo "== Nivel 1: reinicio de Primary e Worker =="
          redeploy "$primary_id" "Primary"
          redeploy "$worker_id" "Worker"

          echo "Agardo 90s a que n8n volva conectar..."
          sleep 90

          echo "== Recomprobacion tras Nivel 1 =="
          if esta_arriba; then
            echo "OK: recuperado co Nivel 1."
            exit 0
          fi

          # === NIVEL 2: segue caido -> reiniciar tamen Postgres e Redis ===
          echo "AVISO: segue caido. Nivel 2: reinicio tamen de Postgres e Redis."
          redeploy "$postgres_id" "Postgres"
          redeploy "$redis_id" "Redis"
          echo "Agardo 60s a que a base de datos estea lista..."
          sleep 60
          redeploy "$primary_id" "Primary"
          redeploy "$worker_id" "Worker"

          echo "Feito (Nivel 2). O n8n deberia volver responder nun par de minutos."
